# EngNest 前面的 Nginx：HTTPS（HTTP/2，一条连接传完一百多个脚本）、压缩、静态文件直接由 Nginx 发，只把 /api/ 转给 Python。
# setup.sh 会把它装到 /etc/nginx/sites-available/engnest，并把 __PORT__ 换成对外的端口（默认 8766）。
# 证书：先用 setup.sh 生成的自签名证书顶着，cert.sh 申请到 Let's Encrypt 的正规证书后覆盖同一路径（IP 证书 6 天有效，定时器自动续）。
server {
    listen __PORT__ ssl http2;   # Ubuntu 24.04 自带的 Nginx 1.24 用这种写法（1.25 起也可以写成单独的 http2 on;）
    server_name _;

    ssl_certificate     /etc/nginx/ssl/engnest.crt;
    ssl_certificate_key /etc/nginx/ssl/engnest.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /opt/engnest/app/web;
    index index.html;
    charset utf-8;

    # 压缩：脚本、样式、数据文件大多是文字，压完约剩 40%
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # 静态文件：浏览器缓存起来，每次只问一下有没有变（没变就 304，几乎不花流量）；更新代码后马上生效
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # 资料包（数据目录里）
    location /packs/ {
        alias /opt/engnest/data/packs/;
        add_header Cache-Control "no-cache" always;
    }

    # 接口：转给只听本机的 EngNest（python main.py --server --host 127.0.0.1 --port 8767 --http）
    location /api/ {
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        client_max_body_size 20m;
        add_header Cache-Control "no-store" always;
    }
}

# 80 端口只做两件事：给 Let's Encrypt 验证用（证明这台服务器是这个 IP / 域名的），其他请求跳到 HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host:__PORT__$request_uri;
    }
}
