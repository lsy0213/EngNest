# 每次推送和 PR：跑 Python 测试、前端测试、学习内容校验
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装测试依赖
        run: python -m pip install pytest==9.1.1

      - name: Python 测试
        run: python -m pytest -q tests

      - name: 前端测试
        run: node --test tests/js/

      - name: 学习内容校验
        run: node tools/validate_data.mjs
